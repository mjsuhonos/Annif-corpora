####################################
# Labels + broader (u1_broader) dataset: preflabel, altlabel, broader
#
#  statements
#  subjects
#  documents
####################################

####################################
# YAKE is basically free
####################################
[u1-broader-yake-en]
name=u1_broader L-YAKE
backend=yake
language=en
vocab=u1_broader(en)
analyzer=snowball(english)
transform=limit(20000)

####################################
# Training RAM: 12GB
# Inferencing RAM: 
####################################
[u1-broader-tfidf-en]
name=u1_broader L-TFIDF
backend=tfidf
language=en
vocab=u1_broader(en)
analyzer=snowball(english)

####################################
# Training RAM: 
# Inferencing RAM: 47GB
####################################
[u1-broader-stwfsa-en]
name=u1_broader L-STWFSA
backend=stwfsa
language=en
vocab=u1_broader(en)
handle_title_case=True
simple_english_plural_rules=True

####################################
# MLLM sub-models
# One for each property
####################################

####################################
# Training RAM: <240GB
# Inferencing RAM: 
####################################
[u1-broader-P31o-mllm-en]
name=u1_broader P31o L-MLLM
backend=mllm
language=en
vocab=u1_broader(en)
analyzer=snowball(english)

