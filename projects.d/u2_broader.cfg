####################################
# Combined ensemble using nn
# Training RAM: 
# Inferencing RAM: 
####################################
[u2-broader-nn-ensemble-en]
name=u2_broader NN Ensemble
backend=nn_ensemble
language=en
vocab=u2_broader(en)
sources=u2-broader-stwfsa-en,u2-broader-P31A-mllm-en,u2-broader-P31B-mllm-en,u2-broader-P31C-mllm-en,u2-broader-P31o-mllm-en,u2-broader-P921o-mllm-en,u2-broader-P910-mllm-en,u2-broader-P279-mllm-en
