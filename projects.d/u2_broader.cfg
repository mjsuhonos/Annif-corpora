####################################
# Labels + broader (u2_broader) dataset: preflabel, altlabel, broader
####################################
[u2-broader-yake-en]
name=u2_broader L-YAKE
backend=yake
language=en
vocab=u2_broader(en)
analyzer=snowball(english)
transform=limit(20000)

[u2-broader-tfidf-en]
name=u2_broader L-TFIDF
backend=tfidf
language=en
vocab=u2_broader(en)
analyzer=snowball(english)

####################################
# Training RAM: 
# Inferencing RAM: 
####################################
[u2-broader-stwfsa-en]
name=u2_broader L-STWFSA
backend=stwfsa
language=en
vocab=u2_broader(en)
handle_title_case=True
simple_english_plural_rules=True
#thesaurus_relation_type_uri=http://www.w3.org/2004/02/skos/core#broader
#thesaurus_relation_is_specialisation=False

####################################
# MLLM sub-models
# One for each property
####################################

